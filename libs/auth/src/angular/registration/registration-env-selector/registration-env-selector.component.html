<form [formGroup]="formGroup" *ngIf="!hideEnvSelector">
  <bit-form-field>
    <bit-label>{{ "creatingAccountOn" | i18n }}</bit-label>
    <bit-select formControlName="selectedEnv">
      <bit-option
        *ngFor="let env of customEnvironments$ | async"
        [value]="'custom:' + env.id"
        [label]="env.label"
      ></bit-option>
      <bit-option
        *ngIf="isDesktopOrBrowserExtension"
        [value]="OTHER_VALUE"
        [label]="'otherServer' | i18n"
      ></bit-option>
      <bit-option
        *ngIf="isDesktopOrBrowserExtension"
        [value]="MANAGE_VALUE"
        [label]="'manageServers' | i18n"
      ></bit-option>
    </bit-select>
  </bit-form-field>
</form>
